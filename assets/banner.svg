<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="xsweep: delete your X posts that nobody saw">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#151a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow2)"/>

  <!-- broom mark -->
  <g transform="translate(86 96) rotate(-32 60 90)">
    <rect x="52" y="-30" width="16" height="130" rx="8" fill="url(#accent)"/>
    <path d="M18 100 H102 L120 176 H0 Z" fill="#e8ecff"/>
    <g stroke="#7c5cff" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <path d="M30 108 L16 170"/><path d="M48 108 L40 170"/><path d="M66 108 L66 170"/><path d="M84 108 L92 170"/><path d="M102 108 L116 170"/>
    </g>
  </g>
  <g fill="#22d3ee" opacity="0.9">
    <path d="M210 74 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    <path d="M254 140 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.7"/>
  </g>

  <!-- title -->
  <text x="300" y="168" fill="#ffffff" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2">xsweep</text>
  <text x="304" y="222" fill="#a9b6dd" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500">Delete your X posts that nobody saw.</text>

  <!-- chips -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#cfd8ff">
    <rect x="304" y="258" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="379" y="285" text-anchor="middle">one paste</text>
    <rect x="466" y="258" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="541" y="285" text-anchor="middle">no install</text>
    <rect x="628" y="258" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="713" y="285" text-anchor="middle">dry run first</text>
    <rect x="810" y="258" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="905" y="285" text-anchor="middle">runs locally</text>
  </g>

  <!-- console card -->
  <g transform="translate(868 62)">
    <rect width="356" height="168" rx="16" fill="#0b1124" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="26" cy="26" r="6" fill="#ff5f57"/><circle cx="46" cy="26" r="6" fill="#febc2e"/><circle cx="66" cy="26" r="6" fill="#28c840"/>
    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17">
      <text x="24" y="68" fill="#22d3ee">[xsweep]</text><text x="118" y="68" fill="#dbe4ff">dry run</text>
      <text x="24" y="98" fill="#7c8bb8">fewer than 10 views</text>
      <text x="24" y="128" fill="#7c8bb8">older than 48 h</text>
      <text x="24" y="156" fill="#a3e635">would delete 142 posts</text>
    </g>
  </g>
</svg>
